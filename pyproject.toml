[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transplang"
version = "0.1.0"
description = "Translate a strict subset of Python scripts into Rust programs."
readme = "README.md"
license = { text = "MIT" }

authors = [
  { name = "Caleb Wodi", email = "calebwodi33@gmail.com" }
]

requires-python = ">=3.10"
keywords = ["transpiler", "rust", "python", "code-generation", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
transplang = "transplang.cli:main"

[project.urls]
Homepage = "https://github.com/calchiwo/transplang"
Issues   = "https://github.com/calchiwo/transplang/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["transplang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]